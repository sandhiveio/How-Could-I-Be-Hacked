<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">The general investigation workflow</title><desc id="desc">Retrieve trajectories, check applicability, run a bounded experiment, record evidence, and iterate based on observations. Verified findings receive regression checks.</desc><rect width="1120" height="360" fill="#fff9ed"/><g font-family="Arial, Helvetica, sans-serif" fill="#242424"><text x="32" y="49" font-size="32" font-weight="700">From a retrieved idea to local evidence.</text><path d="M32 72H1088" stroke="#242424"/><path d="M55 106H1065" fill="none" stroke="#242424" stroke-width="2"/><circle cx="55" cy="106" r="4" fill="#242424"/><text x="32" y="151" font-size="25" font-weight="600">Retrieve related</text><text x="32" y="183" font-size="25" font-weight="600">trajectories</text><text x="32" y="220" font-size="20" fill="#61574d">Search the offline library.</text><circle cx="329" cy="106" r="4" fill="#242424"/><text x="306" y="151" font-size="25" font-weight="600">Check applicability</text><text x="306" y="183" font-size="25" font-weight="600">to your code</text><text x="306" y="220" font-size="20" fill="#61574d">Compare prerequisites.</text><circle cx="603" cy="106" r="4" fill="#242424"/><text x="580" y="151" font-size="25" font-weight="600">Run a bounded</text><text x="580" y="183" font-size="25" font-weight="600">local experiment</text><text x="580" y="220" font-size="20" fill="#61574d">Define controls and falsifiers.</text><circle cx="877" cy="106" r="4" fill="#242424"/><text x="854" y="151" font-size="25" font-weight="600">Record evidence</text><text x="854" y="183" font-size="25" font-weight="600">and reassess</text><text x="854" y="220" font-size="20" fill="#61574d">Keep rejected paths too.</text><path d="M1010 239V264H55V239m-6 8 6-8 6 8" stroke="#e86d00" stroke-width="2" fill="none"/><rect x="351" y="251" width="386" height="25" fill="#fff9ed"/><text x="544" y="271" text-anchor="middle" font-size="22" fill="#9b4300">Observations guide the next round</text><rect x="32" y="297" width="1056" height="43" fill="#242424"/><text x="52" y="327" font-size="23" fill="#fff9ed">Verified finding → regression check</text></g></svg>
