<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-labelledby="title desc"><title id="title">How the library supports an investigation</title><desc id="desc">Retrieve related trajectories from the library, assess their applicability to the authorized codebase, compare hypotheses, run one bounded local experiment, and record observations. Observations guide another retrieval round. Verified findings receive regression checks.</desc><rect width="680" height="550" fill="#f5f5f0"/><g font-family="Arial, Helvetica, sans-serif" fill="#202821">
<text x="32" y="49" font-size="29" font-weight="700">From a retrieved idea to local evidence.</text>
<path d="M32 72H648" stroke="#202821"/>
<g font-size="25" font-weight="600"><text x="108" y="124">Retrieve related trajectories</text><text x="108" y="217">Check applicability to your code</text><text x="108" y="310">Run a bounded local experiment</text><text x="108" y="403">Record evidence and reassess</text></g>
<g font-size="21" fill="#505b51"><text x="108" y="155">Search the offline library for relevant mechanisms.</text><text x="108" y="248">Compare prerequisites and competing hypotheses.</text><text x="108" y="341">Define a control and what would disprove the idea.</text><text x="108" y="434">Keep observations, rejected paths and uncertainty.</text></g>
