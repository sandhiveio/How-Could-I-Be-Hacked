<g fill="#202821"><circle cx="75" cy="116" r="4"/><circle cx="75" cy="209" r="4"/><circle cx="75" cy="302" r="4"/><circle cx="75" cy="395" r="4"/></g>
<path d="M62 395H33V116H57m-8-6 8 6-8 6" stroke="#bf3d24" stroke-width="2" fill="none"/>
<rect x="32" y="474" width="616" height="51" fill="#202821"/><text x="52" y="508" font-size="23" fill="#f5f5f0">Verified finding → regression check</text></g></svg>
