<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">From your code to verified regression checks</title>
  <desc id="desc">An agent retrieves hypotheses, checks their applicability, runs local tests, and adds regression checks for verified findings. Test observations feed the next investigation round.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#ad4b20" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#faf8f3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292d2b">
    <text x="40" y="45" font-size="15" letter-spacing="2">THE LOCAL INVESTIGATION LOOP</text>
    <g fill="#fffefa" stroke="#777b74" stroke-width="1.5">
      <rect x="40" y="100" width="180" height="112" rx="8"/>
      <rect x="270" y="100" width="180" height="112" rx="8"/>
      <rect x="500" y="100" width="180" height="112" rx="8"/>
      <rect x="730" y="100" width="180" height="112" rx="8"/>
      <rect x="960" y="100" width="200" height="112" rx="8" stroke="#3d7151"/>
    </g>
    <g fill="#ad4b20" font-size="14" font-weight="700">
      <text x="58" y="126">01</text><text x="288" y="126">02</text><text x="518" y="126">03</text><text x="748" y="126">04</text>
      <text x="978" y="126" fill="#3d7151">05 / IF VERIFIED</text>
    </g>
    <g font-size="21" font-weight="600">
      <text x="58" y="159">Your code</text>
      <text x="288" y="159">Retrieve</text><text x="288" y="185">hypotheses</text>
      <text x="518" y="159">Check</text><text x="518" y="185">applicability</text>
      <text x="748" y="159">Run local</text><text x="748" y="185">tests</text>
      <text x="978" y="159">Add regression</text><text x="978" y="185">checks</text>
    </g>
    <text x="58" y="185" font-size="15" fill="#626860">Authorized scope</text>
    <g fill="none" stroke="#ad4b20" stroke-width="2" marker-end="url(#arrow)">
      <path d="M226 156H260"/><path d="M456 156H490"/><path d="M686 156H720"/><path d="M916 156H950"/>
      <path d="M820 220V265H360V220"/>
    </g>
    <rect x="435" y="250" width="310" height="30" fill="#faf8f3"/>
    <text x="590" y="270" text-anchor="middle" font-size="16" fill="#ad4b20">Observations guide the next round</text>
    <path d="M40 306H1160" stroke="#dedfd7"/>
    <text x="40" y="336" font-size="16" fill="#626860">Runs locally · No API keys</text>
    <text x="1160" y="336" text-anchor="end" font-size="16" fill="#626860">Agent-led checks · Evidence before conclusions</text>
  </g>
</svg>
