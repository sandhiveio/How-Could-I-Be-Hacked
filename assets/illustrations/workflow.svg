<svg xmlns="http://www.w3.org/2000/svg" width="640" height="536" viewBox="0 0 640 536" role="img" aria-labelledby="title desc"><title id="title">The local investigation workflow</title><desc id="desc">Your code, retrieve hypotheses, check applicability, run local tests, and add regression checks only for verified findings. Observations guide another round of hypothesis retrieval.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#ad4b20" stroke-width="1.6"/></marker></defs><rect width="640" height="536" rx="12" fill="#faf8f3"/><g font-family="Arial, Helvetica, sans-serif"><circle cx="124" cy="58" r="17" fill="#faf8f3" stroke="#292d2b" stroke-width="1.5"/><text x="124" y="65" text-anchor="middle" font-size="21" fill="#292d2b">1</text><text x="162" y="56" font-size="29" font-weight="600" fill="#292d2b">Your code</text><text x="162" y="86" font-size="23" fill="#555e54">Authorized local repository</text><path d="M124 80v24" stroke="#ad4b20" stroke-width="2" marker-end="url(#arrow)"/><circle cx="124" cy="148" r="17" fill="#faf8f3" stroke="#292d2b" stroke-width="1.5"/><text x="124" y="155" text-anchor="middle" font-size="21" fill="#292d2b">2</text><text x="162" y="146" font-size="29" font-weight="600" fill="#292d2b">Retrieve hypotheses</text><text x="162" y="176" font-size="23" fill="#555e54">Search the investigation library</text><path d="M124 170v24" stroke="#ad4b20" stroke-width="2" marker-end="url(#arrow)"/><circle cx="124" cy="238" r="17" fill="#faf8f3" stroke="#292d2b" stroke-width="1.5"/><text x="124" y="245" text-anchor="middle" font-size="21" fill="#292d2b">3</text><text x="162" y="236" font-size="29" font-weight="600" fill="#292d2b">Check applicability</text><text x="162" y="266" font-size="23" fill="#555e54">Compare prerequisites with your code</text><path d="M124 260v24" stroke="#ad4b20" stroke-width="2" marker-end="url(#arrow)"/><circle cx="124" cy="328" r="17" fill="#faf8f3" stroke="#292d2b" stroke-width="1.5"/><text x="124" y="335" text-anchor="middle" font-size="21" fill="#292d2b">4</text><text x="162" y="326" font-size="29" font-weight="600" fill="#292d2b">Run local tests</text><text x="162" y="356" font-size="23" fill="#555e54">Collect evidence; revisit hypotheses</text><path d="M124 350v24" stroke="#ad4b20" stroke-width="2" marker-end="url(#arrow)"/><circle cx="124" cy="418" r="17" fill="#faf8f3" stroke="#356444" stroke-width="1.5"/><text x="124" y="425" text-anchor="middle" font-size="21" fill="#356444">5</text><text x="162" y="416" font-size="29" font-weight="600" fill="#356444">Add regression checks</text><text x="162" y="446" font-size="23" fill="#555e54">Only for verified findings</text><path d="M98 328H54V148H96" fill="none" stroke="#ad4b20" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="238" transform="rotate(-90 36 238)" text-anchor="middle" fill="#94401d" font-size="20">Next round</text><path d="M38 482H602" stroke="#d9dcd3"/><text x="320" y="515" text-anchor="middle" font-size="23" fill="#555e54">Runs locally · No API keys · Agent-led checks</text></g></svg>
